# Behoud uw bestaande instelling
android.useAndroidX=true

# Voeg deze regels toe om het Gradle-geheugen te verhogen naar 4 GB
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Optioneel: Versnel het bouwproces door parallelle uitvoering toe te staan
org.gradle.parallel=true
org.gradle.caching=true
